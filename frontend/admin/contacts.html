<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacts - Admin</title>
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>
    <div class="admin-wrapper">
        <nav class="admin-nav">
            <div class="nav-brand">👑 Admin Panel</div>
            <div class="nav-menu">
                <a href="dashboard.html">Dashboard</a>
                <a href="bookings.html">Bookings</a>
                <a href="contacts.html" class="active">Contacts</a>
                <a href="profile.html">Profile</a>
                <a href="#" id="logoutBtn">Logout</a>
            </div>
        </nav>
        
        <div class="admin-content">
            <h1>Contact Messages</h1>
            
            <div class="table-container">
                <table id="contactsTable">
                    <thead>
                        <tr>
                            <th>Business</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Phone</th>
                            <th>Message</th>
                            <th>Date</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="contactsBody">
                        <tr><td colspan="7">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:5000';
        
        function getToken() {
            return localStorage.getItem('adminToken');
        }
        
        function checkAuth() {
            if (!getToken()) {
                window.location.href = 'login.html';
            }
        }
        
        async function fetchContacts() {
            try {
                const response = await fetch(`${API_URL}/api/admin/contacts`, {
                    headers: { 'Authorization': getToken() }
                });
                const data = await response.json();
                if (data.success) {
                    renderContacts(data.data);
                }
            } catch (error) {
                console.error('Error:', error);
            }
        }
        
        function renderContacts(contacts) {
            const tbody = document.getElementById('contactsBody');
            tbody.innerHTML = '';
            
            if (contacts.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7">No messages found</td></tr>';
                return;
            }
            
            contacts.forEach(contact => {
                const row = tbody.insertRow();
                row.insertCell(0).textContent = contact.businessType || '-';
                row.insertCell(1).textContent = contact.name;
                row.insertCell(2).textContent = contact.email;
                row.insertCell(3).textContent = contact.phone || '-';
                row.insertCell(4).textContent = contact.message.substring(0, 50) + (contact.message.length > 50 ? '...' : '');
                row.insertCell(5).textContent = new Date(contact.createdAt).toLocaleDateString();
                row.insertCell(6).innerHTML = `<button onclick="deleteContact('${contact._id}')" class="btn-delete">Delete</button>`;
            });
        }
        
        async function deleteContact(id) {
            if (confirm('Are you sure you want to delete this message?')) {
                try {
                    const response = await fetch(`${API_URL}/api/admin/contacts/${id}`, {
                        method: 'DELETE',
                        headers: { 'Authorization': getToken() }
                    });
                    const data = await response.json();
                    if (data.success) {
                        alert('Message deleted!');
                        fetchContacts();
                    }
                } catch (error) {
                    alert('Error deleting message');
                }
            }
        }
        
        document.getElementById('logoutBtn').addEventListener('click', (e) => {
            e.preventDefault();
            localStorage.removeItem('adminToken');
            localStorage.removeItem('adminUser');
            window.location.href = 'login.html';
        });
        
        checkAuth();
        fetchContacts();
    </script>
</body>
</html>
