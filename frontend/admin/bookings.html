<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookings - Admin</title>
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>
    <div class="admin-wrapper">
        <nav class="admin-nav">
            <div class="nav-brand">👑 Admin Panel</div>
            <div class="nav-menu">
                <a href="dashboard.html">Dashboard</a>
                <a href="bookings.html" class="active">Bookings</a>
                <a href="contacts.html">Contacts</a>
                <a href="profile.html">Profile</a>
                <a href="#" id="logoutBtn">Logout</a>
            </div>
        </nav>
        
        <div class="admin-content">
            <h1>📅 All Bookings</h1>
            
            <div class="filters">
                <select id="filterBusiness">
                    <option value="all">All Businesses</option>
                    <option value="restaurant">🍽️ Restaurant</option>
                    <option value="gym">💪 Gym</option>
                    <option value="salon">💇 Salon</option>
                </select>
                <input type="text" id="searchInput" placeholder="Search by name, email or service...">
            </div>
            
            <div class="table-container">
                <table id="bookingsTable">
                    <thead>
                        <tr>
                            <th>Business</th>
                            <th>Customer Name</th>
                            <th>Email</th>
                            <th>Phone</th>
                            <th>Service / Class / Occasion</th>
                            <th>Date</th>
                            <th>Time</th>
                            <th>Guests</th>
                            <th>Special Request</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="bookingsBody">
                        <tr><td colspan="10">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:5000';
        let allBookings = [];
        
        function getToken() {
            return localStorage.getItem('adminToken');
        }
        
        function checkAuth() {
            if (!getToken()) {
                window.location.href = 'login.html';
            }
        }
        
        function getBusinessIcon(businessType) {
            const icons = {
                'restaurant': '🍽️',
                'gym': '💪',
                'salon': '💇'
            };
            return icons[businessType] || '📅';
        }
        
        function getServiceDisplay(booking) {
            if (booking.businessType === 'restaurant') {
                if (booking.occasion && booking.occasion !== '') {
                    return `🎉 ${booking.occasion}`;
                }
                return '🍽️ Table Booking';
            }
            if (booking.businessType === 'gym') {
                if (booking.service && booking.service !== '') {
                    return `💪 ${booking.service}`;
                }
                return '💪 Class Booking';
            }
            if (booking.businessType === 'salon') {
                if (booking.service && booking.service !== '') {
                    return `💇 ${booking.service}`;
                }
                return '💇 Service Booking';
            }
            return '📅 Booking';
        }
        
        function getGuestsDisplay(booking) {
            if (booking.businessType === 'restaurant') {
                return booking.guests || '1 person';
            }
            return '1 person';
        }
        
        async function fetchBookings() {
            try {
                const response = await fetch(`${API_URL}/api/admin/bookings`, {
                    headers: { 'Authorization': getToken() }
                });
                const data = await response.json();
                if (data.success) {
                    allBookings = data.data;
                    renderBookings();
                }
            } catch (error) {
                console.error('Error:', error);
            }
        }
        
        function renderBookings() {
            const filter = document.getElementById('filterBusiness').value;
            const search = document.getElementById('searchInput').value.toLowerCase();
            
            let filtered = allBookings;
            if (filter !== 'all') {
                filtered = filtered.filter(b => b.businessType === filter);
            }
            if (search) {
                filtered = filtered.filter(b => 
                    (b.name && b.name.toLowerCase().includes(search)) || 
                    (b.email && b.email.toLowerCase().includes(search)) ||
                    (b.service && b.service.toLowerCase().includes(search)) ||
                    (b.occasion && b.occasion.toLowerCase().includes(search))
                );
            }
            
            const tbody = document.getElementById('bookingsBody');
            tbody.innerHTML = '';
            
            if (filtered.length === 0) {
                tbody.innerHTML = '<tr><td colspan="10">No bookings found</td></tr>';
                return;
            }
            
            filtered.forEach(booking => {
                const row = tbody.insertRow();
                row.insertCell(0).innerHTML = `${getBusinessIcon(booking.businessType)} ${booking.businessType || '-'}`;
                row.insertCell(1).innerHTML = `<strong>${booking.name || '-'}</strong>`;
                row.insertCell(2).textContent = booking.email || '-';
                row.insertCell(3).textContent = booking.phone || '-';
                row.insertCell(4).innerHTML = `<span class="badge ${booking.businessType}">${getServiceDisplay(booking)}</span>`;
                row.insertCell(5).textContent = booking.date || '-';
                row.insertCell(6).textContent = booking.time || '-';
                row.insertCell(7).textContent = getGuestsDisplay(booking);
                
                let specialReq = booking.specialRequests || booking.notes || '';
                row.insertCell(8).innerHTML = specialReq ? `<small>📝 ${specialReq.substring(0, 40)}</small>` : '-';
                
                row.insertCell(9).innerHTML = `<button onclick="deleteBooking('${booking._id}')" class="btn-delete">Delete</button>`;
            });
        }
        
        async function deleteBooking(id) {
            if (confirm('Are you sure you want to delete this booking?')) {
                try {
                    const response = await fetch(`${API_URL}/api/admin/bookings/${id}`, {
                        method: 'DELETE',
                        headers: { 'Authorization': getToken() }
                    });
                    const data = await response.json();
                    if (data.success) {
                        alert('Booking deleted!');
                        fetchBookings();
                    }
                } catch (error) {
                    alert('Error deleting booking');
                }
            }
        }
        
        document.getElementById('filterBusiness').addEventListener('change', renderBookings);
        document.getElementById('searchInput').addEventListener('keyup', renderBookings);
        document.getElementById('logoutBtn').addEventListener('click', (e) => {
            e.preventDefault();
            localStorage.removeItem('adminToken');
            localStorage.removeItem('adminUser');
            window.location.href = 'login.html';
        });
        
        checkAuth();
        fetchBookings();
    </script>
</body>
</html>
