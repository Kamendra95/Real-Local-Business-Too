<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="css/admin.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="admin-wrapper">
        <nav class="admin-nav">
            <div class="nav-brand">👑 Admin Panel</div>
            <div class="nav-menu">
                <a href="dashboard.html" class="active">Dashboard</a>
                <a href="bookings.html">Bookings</a>
                <a href="contacts.html">Contacts</a>
                <a href="profile.html">Profile</a>
                <a href="#" id="logoutBtn">Logout</a>
            </div>
        </nav>
        
        <div class="admin-content">
            <div class="dashboard-header">
                <h1 id="welcomeMessage">Dashboard</h1>
                <button id="refreshBtn" class="btn-refresh">🔄 Refresh</button>
            </div>
            
            <div class="stats-grid" id="statsGrid">
                <div class="stat-card">
                    <h3>📅 Total Bookings</h3>
                    <div class="stat-number" id="totalBookings">-</div>
                </div>
                <div class="stat-card">
                    <h3>📆 Today's Bookings</h3>
                    <div class="stat-number" id="todayBookings">-</div>
                </div>
                <div class="stat-card">
                    <h3>📧 Total Contacts</h3>
                    <div class="stat-number" id="totalContacts">-</div>
                </div>
                <div class="stat-card">
                    <h3>⏳ Pending</h3>
                    <div class="stat-number" id="pendingBookings">-</div>
                </div>
            </div>
            
            <div class="charts-grid">
                <div class="chart-card">
                    <canvas id="bookingChart" height="300"></canvas>
                </div>
                <div class="chart-card">
                    <canvas id="businessChart" height="300"></canvas>
                </div>
            </div>
            
            <div class="recent-section">
                <h2>Recent Bookings</h2>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Business</th>
                                <th>Name</th>
                                <th>Date</th>
                                <th>Time</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody id="recentBookings">
                            <tr><td colspan="5">Loading...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Booking Details Modal -->
    <div id="bookingModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <div id="bookingModalContent"></div>
        </div>
    </div>

    <script src="js/dashboard.js"></script>
</body>
</html>
